databases:
  - name: cityos-db
    plan: free
    databaseName: cityos
    user: cityos_user

services:
  - type: web
    name: cityos-backend
    plan: free
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn cityos.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cityos-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_SETTINGS_MODULE
        value: cityos.settings.production
      - key: WEB_CONCURRENCY
        value: 2
