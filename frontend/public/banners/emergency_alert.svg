<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_alert" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="45%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="glow_red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg_alert)"/>
  <circle cx="1020" cy="200" r="260" fill="url(#glow_red)"/>
  <!-- Warning pulse waves -->
  <circle cx="920" cy="220" r="110" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 6" opacity="0.6"/>
  <circle cx="920" cy="220" r="140" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.3"/>
  <!-- Alert shield icon -->
  <g transform="translate(920, 220)">
    <rect x="-65" y="-65" width="130" height="130" rx="32" fill="#ef4444" fill-opacity="0.25" stroke="#f87171" stroke-width="3"/>
    <path d="M0,-35 L35,-15 L35,15 C35,35 15,45 0,50 C-15,45 -35,35 -35,15 L-35,-15 Z" fill="#fee2e2"/>
    <!-- Exclamation -->
    <rect x="-4" y="-12" width="8" height="22" rx="4" fill="#991b1b"/>
    <circle cx="0" cy="22" r="4.5" fill="#991b1b"/>
  </g>
  <g transform="translate(80, 80)">
    <rect width="250" height="38" rx="19" fill="#991b1b" stroke="#f87171" stroke-width="1.5"/>
    <circle cx="20" cy="19" r="6" fill="#fca5a5"/>
    <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#fee2e2" letter-spacing="1.5">EMERGENCY ADVISORY</text>
  </g>
  <text x="80" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-0.5">IMD Cyclone &amp; Heavy Rain Alert</text>
  <text x="80" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600" fill="#fca5a5">Coastal Districts Preparedness Protocol</text>
  <text x="80" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" fill="#e2e8f0" opacity="0.9">ODRAF &amp; NDRF teams pre-positioned. 24x7 control rooms active.</text>
  <text x="80" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" fill="#e2e8f0" opacity="0.9">Dial 112 / 1070 for immediate municipal assistance.</text>
</svg>
